name: Build and publish container

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64/v8,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/s390x,linux/riscv64

jobs:
  container:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read image version and tags
        id: image
        shell: bash
        run: |
          version="$(xargs < VERSION)"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version (for example, 1.2.3)" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            channel="latest"
            release="v${version}"
          else
            channel="dev"
            release="v${version}-dev"
          fi

          {
            echo "version=${version}"
            echo "build_date=${build_date}"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${channel}"
            echo "${IMAGE_NAME}:${release}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            BUILD_DATE=${{ steps.image.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <link href="./assets/img/apple-icon.png" rel="apple-touch-icon" sizes="76x76">
  <link href="./assets/img/favicon.png" rel="icon" type="image/png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no"/>
  <title>Browser Extensions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="./assets/img/hero-image-01.webp" as="image">
  <link href="./assets/css/main.css" rel="stylesheet"/>
</head>

<body>

<header class="hero">
  <div class="hero-content">
    <h1>Browser Extensions</h1>
    <p>A curated list &mdash; install on any browser</p>
  </div>
</header>

<main>
  <div class="filters">
    <div class="filter-row" id="browser-filter-row">
      <button class="filter-pill active" data-browser="all">All browsers</button>
      <button class="filter-pill" data-browser="chrome">Brave / Chrome</button>
      <button class="filter-pill" data-browser="edge">Edge</button>
      <button class="filter-pill" data-browser="firefox">Firefox</button>
      <button class="filter-pill" data-browser="safari">Safari</button>
    </div>
    <div class="filter-row" id="tag-filter-row"></div>
  </div>

  <div class="ext-grid" id="ext-grid"></div>
</main>

<footer>
  <span>
    &copy; <script>document.write(new Date().getFullYear())</script>
    &nbsp;&middot;&nbsp;
    <a href="https://fboaventura.dev" target="_blank" rel="noopener">fboaventura.dev</a>
  </span>
</footer>

<script src="./assets/js/populateExtensions.js"></script>

</body>
</html>
